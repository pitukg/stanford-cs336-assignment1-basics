name: tinystories-batchsize
base_config: ../tinystories-baseline.yaml

resources:
  gpu: A10
  cpu: 4
  memory_mb: 8192
  timeout_s: 43200
  concurrency: 3

# Match batch-128 cadence: evaluation/checkpoints every 1,638,400 tokens;
# logging every 163,840 tokens (rounded up to whole updates).
trials:
  - name: batch-size-1
    overrides:
      batch_size: 1
      eval_every_n_steps: 6400
      cpt_every_n_steps: 6400
      log_every_n_steps: 640
      n_steps: 1280000
      warmup: 128000
      final: 1280000

  - name: batch-size-16
    overrides:
      batch_size: 16
      eval_every_n_steps: 400
      cpt_every_n_steps: 400
      log_every_n_steps: 40
      n_steps: 80000
      warmup: 8000
      final: 80000

  - name: batch-size-32
    overrides:
      batch_size: 32
      eval_every_n_steps: 200
      cpt_every_n_steps: 200
      log_every_n_steps: 20
      n_steps: 40000
      warmup: 4000
      final: 40000

  - name: batch-size-64
    overrides:
      batch_size: 64
      eval_every_n_steps: 100
      cpt_every_n_steps: 100
      log_every_n_steps: 10
      n_steps: 20000
      warmup: 2000
      final: 20000

  - name: batch-size-128
    overrides:
      batch_size: 128
      eval_every_n_steps: 50
      cpt_every_n_steps: 50
      log_every_n_steps: 5
      n_steps: 10000
      warmup: 1000
      final: 10000

  - name: batch-size-160
    overrides:
      batch_size: 160
      eval_every_n_steps: 40
      cpt_every_n_steps: 40
      log_every_n_steps: 4
      n_steps: 8000
      warmup: 800
      final: 8000
